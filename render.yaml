# Render deployment configuration
services:
  - type: web
    name: waste-scheduler-api
    env: node
    buildCommand: npm ci && npm run db:generate && node -e "const { PrismaClient } = require('@prisma/client'); if (!new PrismaClient().platformSetting) throw new Error('Generated Prisma client is missing PlatformSetting. Check Render Root Directory and deploy commit.');"
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
